[project]
name = "iso-mapping"
version = "0.1.0"
description = "Python functions to assist with climata data rescue projects"
readme = "README.md"
authors = [
    { name = "Vicky Slonosky", email = "VickyS08@users.noreply.github.com" },
    { name = "Henry Balen", email = "balen@users.noreply.github.com" }
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/open-data-rescue/iso-mapping"
Issues = "https://github.com/open-data-rescue/iso-mapping/issues"
