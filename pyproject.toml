[project]
name = "iso-mapping"
dynamic = ["version"]
description = "Python functions to assist with climata data rescue projects"
readme = "README.md"
authors = [
    { name = "Vicky Slonosky", email = "VickyS08@users.noreply.github.com" },
    { name = "Henry Balen", email = "balen@users.noreply.github.com" }
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/open-data-rescue/iso-mapping"
Issues = "https://github.com/open-data-rescue/iso-mapping/issues"

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]
